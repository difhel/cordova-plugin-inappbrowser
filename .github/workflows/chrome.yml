name: Chrome Testsuite

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.eslint*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.eslint*'

permissions:
  contents: read

jobs:
  test:
    name: Chrome Latest Test
    runs-on: ubuntu-latest

    # hoist configurations to top that are expected to be updated
    env:
      # Storing a copy of the repo
      repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      node-version: 24

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node-version }}

      - name: Run install xvfb
        run: sudo apt-get install xvfb

      - name: Ensure Chrome is available
        run: |
          set -euo pipefail

          find_bin() {
            command -v "$1" 2>/dev/null || true
          }

          CHROME_BIN="$(find_bin google-chrome)"
          if [ -z "$CHROME_BIN" ]; then CHROME_BIN="$(find_bin google-chrome-stable)"; fi
          if [ -z "$CHROME_BIN" ]; then CHROME_BIN="$(find_bin chromium-browser)"; fi
          if [ -z "$CHROME_BIN" ]; then CHROME_BIN="$(find_bin chromium)"; fi

          if [ -z "$CHROME_BIN" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            CHROME_BIN="$(find_bin chromium-browser)"
            if [ -z "$CHROME_BIN" ]; then CHROME_BIN="$(find_bin chromium)"; fi
          fi

          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary found" >&2
            exit 1
          fi

          echo "Using Chrome binary: $CHROME_BIN"

          sudo tee /usr/local/bin/google-chrome >/dev/null <<EOF
          #!/usr/bin/env bash
          exec "$CHROME_BIN" --no-sandbox --disable-dev-shm-usage "\$@"
          EOF
          sudo chmod +x /usr/local/bin/google-chrome

          google-chrome --version

      - name: Run Environment Information
        run: |
          node --version
          npm --version

      - name: Run npm install
        run: |
          npm i -g cordova@latest
          npm ci

      - name: Run paramedic install
        if: ${{ endswith(env.repo, '/cordova-paramedic') != true }}
        run: npm i -g github:apache/cordova-paramedic

      - name: Run paramedic tests
        env:
          test_config: 'browser.config.json'
          # Generally, this should automatically work for cordova-paramedic & plugins. If the path is unique, this can be manually changed.
          test_plugin_path: ${{ endswith(env.repo, '/cordova-paramedic') && './spec/testable-plugin/' || './' }}
          paramedic: ${{ endswith(env.repo, '/cordova-paramedic') && 'node main.js' || 'cordova-paramedic' }}
        run: xvfb-run --auto-servernum ${{ env.paramedic }} --config ./pr/local/${{ env.test_config }} --plugin ${{ env.test_plugin_path }}
